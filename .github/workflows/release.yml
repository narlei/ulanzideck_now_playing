name: release-plugin

# Publishes a GitHub Release automatically whenever the plugin's manifest.json
# changes on the default branch (i.e. a version bump landed via merge). The
# Ulanzi Community Store picks the release up on its next catalog build.
on:
  push:
    branches: ['main']
    paths:
      - '*.ulanziPlugin/manifest.json'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (defaults to manifest Version, e.g. 1.0.0)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve version from manifest
        id: meta
        run: |
          dir=$(ls -d *.ulanziPlugin 2>/dev/null | head -1)
          if [ -z "$dir" ]; then echo "No .ulanziPlugin folder at the repository root" >&2; exit 1; fi
          version="${{ github.event.inputs.version }}"
          version="${version#v}"
          if [ -z "$version" ]; then version=$(jq -r .Version "$dir/manifest.json"); fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.meta.outputs.version }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.meta.outputs.version }} already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build plugin zip(s)
        if: steps.check.outputs.exists == 'false'
        run: |
          found=0
          for dir in *.ulanziPlugin; do
            [ -d "$dir" ] || continue
            echo "Packaging $dir"
            # node_modules/ is gitignored, so the checkout has none — the plugin
            # host runs plain `node app.js` with no install step, so the runtime
            # deps (ws) must be bundled or the plugin dies on first import.
            (cd "$dir" && npm ci --omit=dev --no-audit --no-fund)
            [ -d "$dir/node_modules/ws" ] || { echo "ws missing from $dir/node_modules" >&2; exit 1; }
            zip -r "${dir}.zip" "$dir" -x "*.DS_Store"
            found=1
          done
          if [ "$found" = "0" ]; then
            echo "No .ulanziPlugin directory found at the repository root" >&2
            exit 1
          fi

      # Release notes come from CHANGELOG.md when it has a section for this
      # version. Commits land straight on main here, so --generate-notes (which
      # lists merged PRs) produces an empty body — it stays as the fallback for
      # a version nobody wrote an entry for.
      - name: Extract release notes from CHANGELOG.md
        if: steps.check.outputs.exists == 'false'
        id: notes
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "No CHANGELOG.md — falling back to generated notes."
            echo "file=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Everything between this version's heading and the next one.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::warning::No CHANGELOG.md section for $VERSION — falling back to generated notes."
            rm -f RELEASE_NOTES.md
            echo "file=" >> "$GITHUB_OUTPUT"
          else
            echo "file=RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          if [ -n "$NOTES_FILE" ]; then
            notes_arg=(--notes-file "$NOTES_FILE")
          else
            notes_arg=(--generate-notes)
          fi
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$VERSION" \
            "${notes_arg[@]}" \
            --latest \
            *.ulanziPlugin.zip
